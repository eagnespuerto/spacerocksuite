name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 pinned: ubuntu-latest (26.04) has no Python 3.9, which Pi OS Bullseye still uses
        os: [ubuntu-24.04, windows-latest, ubuntu-24.04-arm]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest
          pip install -e .
      - name: Tests (NumPy fallback)
        env:
          SRS_NO_RUST: "1"
        run: pytest -q -m "not network"
      - name: Build Rust core
        run: |
          maturin build --release -m rust/Cargo.toml -o wheelhouse
          pip install --no-index --find-links wheelhouse srs_core
      - name: Tests (Rust core)
        run: pytest -q -m "not network"
      - name: CLI smoke test
        run: python -m spacerocksuite info
