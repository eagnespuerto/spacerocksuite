name: Release

# Push a tag vX.Y.Z (matching spacerocksuite/__init__.py) to build and publish:
#   Windows installer + portable zip, Linux x86_64 bundle, Raspberry Pi OS
#   bundles (64-bit arm64 and 32-bit armv7, for a Pi 3B+ on either OS).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-wheels:
    name: srs_core ${{ matrix.tag }}
    strategy:
      fail-fast: false          # one flaky build should not cancel the other targets
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            tag: windows
            zig: ""
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            tag: linux-x86_64
            zig: "--zig --compatibility manylinux2014"
          - os: ubuntu-latest
            triple: aarch64-unknown-linux-gnu
            tag: linux-arm64
            zig: "--zig --compatibility manylinux2014"
          - os: ubuntu-latest
            triple: armv7-unknown-linux-gnueabihf
            tag: linux-armv7
            zig: "--zig --compatibility manylinux2014"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      # Cross-compile on the runner with zig (no Docker), still manylinux2014,
      # so the wheels load on older glibc such as Raspberry Pi OS Bullseye.
      - name: Build wheel
        working-directory: rust
        shell: bash
        run: |
          pip install "maturin>=1.6,<2" ziglang
          maturin build --release --target ${{ matrix.triple }} ${{ matrix.zig }} -i python -o ../wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.tag }}
          path: wheelhouse/*.whl

  py-wheel:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        run: |
          V=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('spacerocksuite/__init__.py').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $V"; exit 1
          fi
      - run: pip install build && python -m build --wheel -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: py-wheel
          path: dist/*.whl

  windows:
    needs: [core-wheels, py-wheel]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: core-windows
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: py-wheel
          path: wheelhouse
      - name: Install app + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install (Get-ChildItem wheelhouse\*.whl).FullName
      - name: Freeze
        run: pyinstaller packaging/windows/spacerocksuite.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test
        run: dist\SpaceRockSuite\srs.exe info
      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.py-wheel.outputs.version }} packaging\windows\installer.iss
          Compress-Archive -Path dist\SpaceRockSuite -DestinationPath dist\SpaceRockSuite-${{ needs.py-wheel.outputs.version }}-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  bundles:
    needs: [core-wheels, py-wheel]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: [linux-x86_64, linux-arm64, linux-armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-${{ matrix.tag }}
          path: b
      - uses: actions/download-artifact@v4
        with:
          name: py-wheel
          path: b
      - name: Bundle
        run: |
          V=${{ needs.py-wheel.outputs.version }}
          D=spacerocksuite-$V-${{ matrix.tag }}
          mkdir "$D"
          cp b/*.whl packaging/linux/install.sh packaging/icons/spacerocksuite.png LICENSE "$D"/
          mv "$D/spacerocksuite.png" "$D/icon.png"
          chmod +x "$D/install.sh"
          tar czf "$D.tar.gz" "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.tag }}
          path: "*.tar.gz"

  publish:
    needs: [windows, bundles, py-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.py-wheel.outputs.version }}
          ls -la out
          NOTES=$(awk "/^## \\[?$V\\]?/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          gh release create "v$V" out/*.exe out/*.zip out/*.tar.gz out/spacerocksuite-*.whl \
            --title "SpaceRockSuite $V" --notes "${NOTES:-See CHANGELOG.md}"
